<div class="flex items-center justify-between">
    <h1 class="title">Subjects<span>.</span></h1>
    <a href="#add-subject" class="btn">Add Subject</a>
</div>

<div class="items-grid" x-data="subjects">
    <template x-for="(subject, index) in subjects" :key="index">
        <div class="item">
            <div class="item-info">
                <span x-text="subject.subjectName"></span>
            </div>
            <div class="item-actions">
                
                <a href="#">Edit</a> 
                <span>▪</span>
                <a href="#">Remove</a>
            </div>
        </div>
    </template>
    
    <div x-show="!subjects.length" class="empty-state"> 
        <h2>No subjects yet</h2>
        <p class="mb-3">Add your first subject to get started.</p>
        <a href="#add-subject" class="btn btn-secondary text-sm">
            Add Subject
        </a>
    </div>
</div>
